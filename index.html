<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>依頼タスク</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --subtle: #f7f9fb;
      --text: #202d3c;
      --muted: #5e6b7c;
      --border: #dce2e9;
      --accent: #246353;
      --accent-soft: #eaf4ef;
      --red: #aa343c;
      --red-soft: #fff0f0;
      --red-border: #ecc5c8;
      --orange: #955600;
      --orange-soft: #fff3dc;
      --shadow: 0 12px 40px rgb(26 42 59 / 10%);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141a21;
        --surface: #1d252e;
        --subtle: #242e39;
        --text: #e9eef5;
        --muted: #aab7c7;
        --border: #3b4755;
        --accent: #9bd8bf;
        --accent-soft: #203d34;
        --red: #ffadb2;
        --red-soft: #3c262c;
        --red-border: #72424a;
        --orange: #ffd08a;
        --orange-soft: #423525;
        --shadow: 0 12px 40px rgb(0 0 0 / 25%);
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      font-size: 14px;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }
    button, input, textarea, select { font: inherit; }
    button, summary, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button, input, select, summary { min-height: 44px; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .5; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    input, textarea, select {
      width: 100%;
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
    }
    input:disabled, textarea:disabled, select:disabled { opacity: .65; }
    input[type="date"] { appearance: none; min-height: 48px; }
    input[type="date"]::-webkit-date-and-time-value { text-align: left; }
    textarea { display: block; min-height: 92px; resize: vertical; }
    ::placeholder { color: var(--muted); opacity: .85; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 28px; letter-spacing: -.04em; line-height: 1.35; }
    h2 { font-size: 17px; line-height: 1.5; }
    h3 { font-size: 16px; }
    .app {
      max-width: 860px;
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
        max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    .header-top, .section-heading, .task-heading, .form-footer, .dialog-heading {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .eyebrow { color: var(--accent); font-size: 11px; letter-spacing: .16em; font-weight: 700; margin-bottom: 6px; }
    .today-label { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .metrics { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 18px; }
    .metric { border-radius: 8px; padding: 6px 10px; background: var(--surface); border: 1px solid var(--border); }
    .metric strong { font-size: 18px; margin-left: 8px; }
    .metric.overdue { color: var(--red); background: var(--red-soft); border-color: var(--red-border); }
    .btn {
      display: inline-flex; justify-content: center; align-items: center; gap: 6px;
      min-width: 44px; min-height: 44px; padding: 10px 14px;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); color: var(--text); font-weight: 600; line-height: 1.5;
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
    .btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
    .btn.danger { color: var(--red); border-color: var(--red-border); background: var(--red-soft); }
    .btn.quiet { background: transparent; }
    @media (hover: hover) { .btn:hover:not(:disabled) { filter: brightness(.94); } }
    .sync-status { display: flex; align-items: center; gap: 8px; min-height: 32px; color: var(--muted); font-size: 12px; }
    .sync-status.loading::before {
      content: ""; width: 12px; height: 12px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .composer { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin: 4px 0 28px; }
    summary { cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .composer > summary { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; font-size: 16px; font-weight: 700; }
    .composer > summary::after { content: "+"; font-size: 22px; color: var(--accent); }
    .composer[open] > summary::after { content: "−"; }
    .composer[open] > summary { border-bottom: 1px solid var(--border); }
    #add-form { padding: 18px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field > label { font-size: 13px; font-weight: 700; }
    .field-note { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 8px; }
    .wide { grid-column: 1 / -1; }
    .quick-dates { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
    .quick-dates .btn { padding: 8px 10px; font-size: 12px; font-weight: 500; background: var(--subtle); }
    .category-preview { width: 100%; text-align: left; justify-content: space-between; color: var(--accent); background: var(--accent-soft); border-color: transparent; }
    .category-preview::after { content: "変更"; flex-shrink: 0; font-size: 12px; font-weight: 400; }
    .manual-category { display: grid; gap: 6px; }
    .manual-category .btn { justify-self: start; padding-left: 0; padding-right: 0; border: 0; color: var(--accent); font-size: 12px; }
    .hint { color: var(--muted); font-size: 12px; }
    .form-footer { margin-top: 18px; }
    .form-footer .btn { min-width: 150px; }
    .section-heading { margin-bottom: 12px; }
    .section-heading > div { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .count { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; padding: 1px 8px; border-radius: 6px; background: var(--subtle); color: var(--muted); font-size: 12px; font-weight: 700; }
    .overdue-panel { padding: 16px; background: var(--red-soft); border: 1px solid var(--red-border); border-radius: 16px; margin-bottom: 30px; }
    .overdue-panel > .section-heading { color: var(--red); }
    .overdue-panel .section-heading .count { color: var(--red); background: var(--surface); }
    .overdue-hint { margin: -5px 0 14px; color: var(--red); font-size: 12px; }
    .task-list { display: grid; gap: 10px; }
    .task-card { min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
    .task-card.is-overdue { border-left: 3px solid var(--red); }
    .task-card.is-today { border-left: 3px solid var(--orange); }
    .task-summary { padding: 15px; }
    .task-heading { align-items: flex-start; gap: 14px; }
    .task-title { font-size: 15px; font-weight: 700; white-space: pre-wrap; }
    .chevron { flex-shrink: 0; display: block; margin-top: 5px; width: 8px; height: 8px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); }
    .task-card[open] .chevron { transform: rotate(225deg); margin-top: 9px; }
    .task-meta { display: flex; flex-wrap: wrap; align-items: center; column-gap: 12px; row-gap: 6px; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .due { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .relative { font-size: 11px; padding: 1px 6px; border-radius: 4px; font-weight: 600; background: var(--subtle); }
    .is-overdue .due { color: var(--red); }
    .is-overdue .relative { background: var(--red-soft); }
    .is-today .due { color: var(--orange); }
    .is-today .relative { background: var(--orange-soft); }
    .task-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag { display: inline-block; padding: 2px 7px; border: 1px solid var(--border); border-radius: 5px; color: var(--muted); font-size: 11px; }
    .task-expanded { border-top: 1px solid var(--border); padding: 14px 15px; }
    .task-detail { white-space: pre-wrap; font-size: 14px; margin-bottom: 14px; }
    .task-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .task-actions .btn { padding: 9px 12px; font-size: 13px; }
    .urgent-card { padding: 15px; }
    .urgent-card .task-actions { margin-top: 14px; display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 6px; }
    .urgent-card .task-actions .btn { padding: 9px 5px; }
    .category-nav { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 12px; margin: 0 -2px 18px; scrollbar-width: thin; }
    .category-chip { flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 12px; border-radius: 24px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 12px; text-decoration: none; }
    .category-chip span { color: var(--accent); font-weight: 700; }
    .category-section { scroll-margin-top: 20px; margin-bottom: 26px; }
    .empty-state { text-align: center; padding: 42px 20px; background: var(--surface); border: 1px dashed var(--border); border-radius: 16px; }
    .empty-mark { display: inline-flex; justify-content: center; align-items: center; width: 46px; height: 46px; background: var(--accent-soft); color: var(--accent); border-radius: 50%; font-size: 22px; margin-bottom: 12px; }
    .empty-state p + p { margin-top: 8px; }
    .toast { position: fixed; z-index: 10; top: max(12px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px 14px; color: var(--red); background: var(--red-soft); border: 1px solid var(--red-border); border-radius: 12px; box-shadow: var(--shadow); }
    .toast p { flex: 1; }
    .toast .btn { flex-shrink: 0; padding: 8px; color: var(--red); border-color: var(--red-border); }
    dialog { width: calc(100% - 32px); max-width: 480px; max-height: calc(100dvh - 48px); padding: 0; border: 1px solid var(--border); border-radius: 18px; color: var(--text); background: var(--surface); box-shadow: var(--shadow); overflow: auto; }
    dialog::backdrop { background: rgb(8 16 25 / 50%); }
    .dialog-content { padding: 20px; }
    .dialog-heading { margin-bottom: 12px; }
    .dialog-heading h2 { font-size: 19px; }
    .dialog-task { color: var(--muted); font-size: 13px; white-space: pre-wrap; margin-bottom: 18px; }
    .dialog-fields { display: grid; gap: 16px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .dialog-actions .btn { flex: 1; }
    .dialog-error { color: var(--red); background: var(--red-soft); padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; }
    .dialog-status { color: var(--muted); min-height: 20px; font-size: 12px; margin-top: 10px; }
    @media (max-width: 540px) {
      .app { padding-top: max(20px, env(safe-area-inset-top)); }
      h1 { font-size: 26px; }
      .form-grid { grid-template-columns: minmax(0, 1fr); }
      #add-form { padding: 16px; }
      .form-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .form-footer .btn { width: 100%; }
      .overdue-panel { padding: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .sync-status.loading::before { animation: none; }
    }
  </style>
</head>
<body>
  <div id="toast" class="toast" role="alert" hidden>
    <p id="toast-message"></p>
    <button id="dismiss-toast" class="btn" type="button" aria-label="エラーを閉じる">閉じる</button>
  </div>
  <main id="app" class="app" aria-busy="true">
    <header>
      <div class="header-top">
        <div>
          <p class="eyebrow">TASK TRACKER</p>
          <h1>依頼タスク</h1>
          <p id="today-label" class="today-label">依頼と進捗をまとめて管理</p>
        </div>
        <button id="refresh" class="btn quiet" type="button" disabled>再読込</button>
      </div>
      <div class="metrics" aria-label="依頼の件数">
        <span class="metric">進行中<strong id="total-count">—</strong><span> 件</span></span>
        <span id="overdue-metric" class="metric overdue" hidden>期限切れ<strong id="overdue-count"></strong><span> 件</span></span>
      </div>
      <p id="sync-status" class="sync-status loading" role="status" aria-live="polite">読み込み中…</p>
    </header>

    <details id="composer" class="composer" open>
      <summary>新しい依頼を登録</summary>
      <form id="add-form">
        <div class="form-grid">
          <div class="field wide">
            <label for="assignee">依頼先<span class="field-note">必須</span></label>
            <input id="assignee" name="assignee" type="text" list="assignee-options" placeholder="名前を入力" required disabled>
          </div>
          <div class="field wide">
            <label for="task-title">依頼内容<span class="field-note">必須</span></label>
            <input id="task-title" name="title" type="text" placeholder="何を依頼しましたか？" required disabled>
          </div>
          <div class="field wide">
            <label for="task-detail">詳細<span class="field-note">任意</span></label>
            <textarea id="task-detail" name="detail" rows="3" placeholder="補足や確認してほしいこと" disabled></textarea>
          </div>
          <div class="field wide">
            <label for="task-due">期限<span class="field-note">必須</span></label>
            <input id="task-due" name="due" type="date" required disabled>
            <div id="add-quick-dates" class="quick-dates" aria-label="期限の候補"></div>
          </div>
          <div class="field wide">
            <label id="category-label" for="category-preview">分類</label>
            <button id="category-preview" class="btn category-preview" type="button" aria-controls="manual-category" aria-expanded="false" disabled>自動判別: 読み込み中</button>
            <div id="manual-category" class="manual-category" hidden>
              <select id="task-category" aria-labelledby="category-label" disabled></select>
              <button id="use-auto-category" class="btn quiet" type="button" disabled>自動判別に戻す</button>
            </div>
            <p id="category-hint" class="hint">内容と詳細から自動で分類します。</p>
          </div>
        </div>
        <div class="form-footer">
          <p class="hint">登録した依頼は、事業ごとに表示されます。</p>
          <button id="add-submit" class="btn primary" type="submit" disabled>依頼を登録</button>
        </div>
      </form>
    </details>

    <section id="overdue-section" class="overdue-panel" aria-labelledby="overdue-heading" hidden>
      <div class="section-heading">
        <div><h2 id="overdue-heading">期限切れ</h2><span id="overdue-section-count" class="count"></span></div>
      </div>
      <p class="overdue-hint">完了、または次の期限を設定してください。</p>
      <div id="overdue-list" class="task-list"></div>
    </section>

    <section id="business-section" aria-labelledby="business-heading" hidden>
      <div class="section-heading"><h2 id="business-heading">事業別一覧</h2><p class="hint">期限が近い順</p></div>
      <nav id="category-nav" class="category-nav" aria-label="事業別の件数と移動"></nav>
      <div id="category-sections"></div>
    </section>
    <div id="empty-state" class="empty-state" hidden>
      <span class="empty-mark" aria-hidden="true">✓</span>
      <p><strong>進行中の依頼はありません</strong></p>
      <p class="hint">新しい依頼は上のフォームから登録できます。</p>
    </div>
    <div id="load-failure" class="empty-state" hidden>
      <p>依頼を読み込めませんでした</p>
      <p class="hint">上の「再読込」からもう一度お試しください。</p>
    </div>
  </main>
  <datalist id="assignee-options"></datalist>

  <dialog id="task-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-task">
    <form id="dialog-form" class="dialog-content">
      <div class="dialog-heading"><h2 id="dialog-title"></h2></div>
      <p id="dialog-task" class="dialog-task"></p>
      <p id="dialog-error" class="dialog-error" role="alert" hidden></p>
      <div id="dialog-fields" class="dialog-fields"></div>
      <div class="dialog-actions">
        <button id="dialog-cancel" class="btn" type="button">キャンセル</button>
        <button id="dialog-submit" class="btn primary" type="submit">保存</button>
      </div>
      <p id="dialog-status" class="dialog-status" role="status" aria-live="polite"></p>
    </form>
  </dialog>

  <script>
    'use strict';

    (() => {
      const $ = id => document.getElementById(id);
      const DAY_MS = 86400000;
      let state = null;
      let busy = false;
      let refreshPending = false;
      let manualCategory = false;
      let dueTouched = false;
      let modalSubmit = null;
      let modalTaskId = null;
      let modalOpener = null;
      const expandedTasks = new Set();

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = String(text);
        return node;
      }

      function button(label, className, handler) {
        const node = element('button', 'btn' + (className ? ' ' + className : ''), label);
        node.type = 'button';
        node.addEventListener('click', () => { if (!busy) handler(); });
        return node;
      }

      // UTC is only used for calendar arithmetic; the reference date always comes from the server.
      function dateNumber(value) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return NaN;
        const result = Date.parse(value + 'T00:00:00Z');
        if (!Number.isFinite(result)) return NaN;
        return new Date(result).toISOString().slice(0, 10) === value ? result : NaN;
      }

      function shiftDate(value, days) {
        return new Date(dateNumber(value) + days * DAY_MS).toISOString().slice(0, 10);
      }

      function monthEnd(value) {
        const date = new Date(dateNumber(value));
        date.setUTCMonth(date.getUTCMonth() + 1, 0);
        return date.toISOString().slice(0, 10);
      }

      function prettyDate(value) {
        const parts = value.split('-');
        return Number(parts[1]) + '/' + Number(parts[2]);
      }

      function relativeDue(value) {
        const days = Math.round((dateNumber(value) - dateNumber(state.today)) / DAY_MS);
        if (days === 0) return '今日';
        return days < 0 ? Math.abs(days) + '日超過' : 'あと' + days + '日';
      }

      function predictedCategory() {
        if (!state) return '読み込み中';
        const text = ($('task-title').value.trim() + ' ' + $('task-detail').value.trim()).toLowerCase();
        const match = state.rules.find(rule => rule.keywords.some(word => text.includes(word.toLowerCase())));
        return match ? match.name : state.other;
      }

      function updateCategoryPreview() {
        $('category-preview').textContent = '自動判別: ' + predictedCategory();
        $('category-preview').hidden = manualCategory;
        $('category-preview').setAttribute('aria-expanded', String(manualCategory));
        $('manual-category').hidden = !manualCategory;
        $('category-label').htmlFor = manualCategory ? 'task-category' : 'category-preview';
        $('category-hint').textContent = manualCategory ? '選んだ分類で登録します。' : '内容と詳細から自動で分類します。';
      }

      function populateCategories(select, selected) {
        select.replaceChildren();
        state.categories.forEach(name => {
          const option = element('option', '', name);
          option.value = name;
          select.append(option);
        });
        select.value = state.categories.includes(selected) ? selected : state.other;
      }

      function quickDates(container, input, includeMonthEnd, onChange) {
        const choices = [['明日', 1], ['3日後', 3], ['1週間後', 7]];
        if (includeMonthEnd) choices.push(['月末', null]);
        choices.forEach(([label, days]) => {
          container.append(button(label, '', () => {
            if (!state) return;
            input.value = days === null ? monthEnd(state.today) : shiftDate(state.today, days);
            input.setCustomValidity('');
            if (onChange) onChange();
          }));
        });
      }

      function clearError() {
        $('toast').hidden = true;
        $('toast-message').textContent = '';
        $('dialog-error').hidden = true;
        $('dialog-error').textContent = '';
      }

      function showError(error) {
        const detail = error && error.message ? String(error.message) : '';
        const message = '処理できませんでした。' + (detail ? ' ' + detail : '通信状況を確認し、もう一度お試しください。');
        $('toast-message').textContent = message;
        $('toast').hidden = false;
        if ($('task-dialog').open) {
          $('dialog-error').textContent = message;
          $('dialog-error').hidden = false;
        }
        if (!state) $('load-failure').hidden = false;
      }

      function syncControls() {
        document.querySelectorAll('button, input, textarea, select').forEach(control => {
          const needsState = control.closest('#add-form') || control.closest('#dialog-form');
          control.disabled = busy || (!state && Boolean(needsState));
        });
        $('app').setAttribute('aria-busy', String(busy));
        $('dialog-form').setAttribute('aria-busy', String(busy));
        $('sync-status').classList.toggle('loading', busy);
      }

      // 画面は GitHub Pages、データは GAS の doPost。トークンは初回URLの #token= で受け取り端末に保存する
      const API_URL = 'https://script.google.com/macros/s/AKfycbzmptDpw5oYfch4GJb3utp9nU1QCJJZCZ1d0i2ZCi-q_61Ek5NEr7H_3tUzCf3t5kjS6g/exec';
      const TOKEN_KEY = 'task-tracker-token';

      // トークンは URL の #token= に残す。iOS のホーム画面アプリは Safari と保存領域が別で、
      // 追加時の URL だけが引き継がれるため、URL から消すとホーム画面版が未設定になる
      function apiToken() {
        const m = location.hash.match(/token=([0-9a-f]+)/);
        if (m) {
          try { localStorage.setItem(TOKEN_KEY, m[1]); } catch (e) {}
          return m[1];
        }
        let saved = '';
        try { saved = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
        if (saved) history.replaceState(null, '', location.pathname + location.search + '#token=' + saved);
        return saved;
      }

      async function callServer(method, args) {
        const token = apiToken();
        if (!token) throw new Error('この端末は未設定です。初回設定用のURL(#token= 付き)から一度開いてください。');
        // text/plain にして CORS のプリフライトを避ける(GAS は OPTIONS に応答しない)
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ token, method, args }),
        });
        if (!res.ok) throw new Error(`サーバーに接続できません(${res.status})`);
        const body = await res.json();
        if (!body.ok) throw new Error(body.error || 'サーバーでエラーが起きました');
        return body.data;
      }

      async function request(method, args = [], message = '更新しました', afterSuccess) {
        if (busy) return;
        busy = true;
        clearError();
        $('sync-status').textContent = method === 'getState' ? '読み込み中…' : '保存中…';
        $('dialog-status').textContent = method === 'getState' ? '読み込み中…' : '保存中…';
        $('add-submit').textContent = method === 'addTask' ? '登録中…' : '依頼を登録';
        syncControls();
        try {
          const next = await callServer(method, args);
          if (!next || !Number.isFinite(dateNumber(next.today)) || !Array.isArray(next.tasks) ||
              !Array.isArray(next.categories) || !Array.isArray(next.rules) || !Array.isArray(next.assignees)) {
            throw new Error('読み込んだデータを確認できません。再読込してください。');
          }
          state = next;
          render();
          if (afterSuccess) afterSuccess();
          $('sync-status').textContent = message;
        } catch (error) {
          showError(error);
          $('sync-status').textContent = '更新できませんでした';
        } finally {
          busy = false;
          $('add-submit').textContent = '依頼を登録';
          $('dialog-status').textContent = '';
          syncControls();
          if (refreshPending && document.visibilityState === 'visible') {
            refreshPending = false;
            request('getState', [], '最新の状態に更新しました');
          }
        }
      }

      function appendTaskInfo(container, task, expandable) {
        const heading = element('span', 'task-heading');
        heading.append(element('span', 'task-title', task.title));
        if (expandable) {
          const chevron = element('span', 'chevron');
          chevron.setAttribute('aria-hidden', 'true');
          heading.append(chevron);
        }
        const meta = element('span', 'task-meta');
        meta.append(element('span', '', '依頼先: ' + task.assignee));
        const due = element('span', 'due');
        const time = element('time', '', (task.due.slice(0, 4) === state.today.slice(0, 4) ? '' : task.due.slice(0, 4) + '/') + prettyDate(task.due));
        time.dateTime = task.due;
        time.title = task.due;
        due.append(time, element('span', 'relative', relativeDue(task.due)));
        meta.append(due);
        const tags = element('span', 'task-tags');
        tags.append(element('span', 'tag', task.category));
        const history = String(task.due_history || '').split(',').filter(value => value.trim());
        if (history.length) tags.append(element('span', 'tag', '延期' + history.length + '回'));
        container.append(heading, meta, tags);
      }

      function taskClass(task) {
        return task.overdue ? ' is-overdue' : task.dueToday ? ' is-today' : '';
      }

      function taskActions(task, urgent) {
        const actions = element('div', 'task-actions');
        actions.append(
          button('完了', 'soft', () => request('completeTask', [task.id], '依頼を完了しました')),
          button('期限再設定', '', () => openReschedule(task))
        );
        if (!urgent) {
          actions.append(
            button('分類変更', '', () => openCategory(task)),
            button('編集', '', () => openEdit(task))
          );
        }
        actions.append(button('削除', 'danger', () => openDelete(task)));
        return actions;
      }

      function taskCard(task, urgent) {
        if (urgent) {
          const card = element('article', 'task-card urgent-card' + taskClass(task));
          appendTaskInfo(card, task, false);
          card.append(taskActions(task, true));
          return card;
        }
        const card = element('details', 'task-card' + taskClass(task));
        card.open = expandedTasks.has(task.id);
        const summary = element('summary', 'task-summary');
        appendTaskInfo(summary, task, true);
        const detail = element('div', 'task-expanded');
        detail.append(element('p', 'task-detail' + (task.detail ? '' : ' hint'), task.detail || '詳細はありません'), taskActions(task, false));
        card.append(summary, detail);
        card.addEventListener('toggle', () => {
          if (!card.isConnected) return;
          if (card.open) expandedTasks.add(task.id);
          else expandedTasks.delete(task.id);
        });
        return card;
      }

      function render() {
        const overdue = state.tasks.filter(task => task.overdue);
        $('total-count').textContent = String(state.tasks.length);
        $('overdue-count').textContent = String(overdue.length);
        $('overdue-metric').hidden = overdue.length === 0;
        $('overdue-section').hidden = overdue.length === 0;
        $('overdue-section-count').textContent = overdue.length + '件';
        $('today-label').textContent = state.today.replace(/-/g, '/') + ' 時点（日本時間）';
        $('load-failure').hidden = true;
        $('empty-state').hidden = state.tasks.length !== 0;
        $('business-section').hidden = state.tasks.length === 0;
        $('overdue-list').replaceChildren(...overdue.map(task => taskCard(task, true)));

        const currentIds = new Set(state.tasks.map(task => task.id));
        expandedTasks.forEach(id => { if (!currentIds.has(id)) expandedTasks.delete(id); });
        if ($('task-dialog').open && !currentIds.has(modalTaskId)) closeDialog();

        $('category-nav').replaceChildren();
        $('category-sections').replaceChildren();
        state.categories.forEach((category, index) => {
          const tasks = state.tasks.filter(task => task.category === category);
          if (!tasks.length) return;
          const sectionId = 'category-section-' + index;
          const headingId = 'category-heading-' + index;
          const chip = element('a', 'category-chip', category);
          chip.href = '#' + sectionId;
          chip.append(element('span', '', tasks.length));
          chip.setAttribute('aria-label', category + ' ' + tasks.length + '件へ移動');
          chip.addEventListener('click', event => {
            event.preventDefault();
            const target = $(sectionId);
            target.scrollIntoView({ block: 'start' });
            $(headingId).focus({ preventScroll: true });
          });
          $('category-nav').append(chip);
          const section = element('section', 'category-section');
          section.id = sectionId;
          section.setAttribute('aria-labelledby', headingId);
          const heading = element('div', 'section-heading');
          const headingGroup = element('div');
          const title = element('h3', '', category);
          title.id = headingId;
          title.tabIndex = -1;
          headingGroup.append(title, element('span', 'count', tasks.length));
          heading.append(headingGroup);
          const list = element('div', 'task-list');
          list.append(...tasks.map(task => taskCard(task, false)));
          section.append(heading, list);
          $('category-sections').append(section);
        });

        $('assignee-options').replaceChildren(...state.assignees.map(name => {
          const option = element('option');
          option.value = name;
          return option;
        }));
        const selected = $('task-category').value;
        populateCategories($('task-category'), selected);
        if (!dueTouched) $('task-due').value = shiftDate(state.today, 7);
        updateCategoryPreview();
        syncControls();
      }

      function resetAddForm() {
        $('add-form').reset();
        manualCategory = false;
        dueTouched = false;
        $('task-due').value = shiftDate(state.today, 7);
        updateCategoryPreview();
      }

      function requiredText(input, message) {
        input.setCustomValidity(input.value.trim() ? '' : message);
        return input.reportValidity();
      }

      function validDue(input) {
        input.setCustomValidity(Number.isFinite(dateNumber(input.value)) ? '' : '期限を正しい日付で入力してください。');
        return input.reportValidity();
      }

      function openDialog(task, title, submitLabel, danger) {
        modalOpener = document.activeElement;
        modalTaskId = task.id;
        modalSubmit = null;
        clearError();
        $('dialog-title').textContent = title;
        $('dialog-task').textContent = task.title;
        $('dialog-fields').replaceChildren();
        $('dialog-submit').textContent = submitLabel;
        $('dialog-submit').className = 'btn ' + (danger ? 'danger' : 'primary');
        $('dialog-status').textContent = '';
      }

      function showDialog(focusTarget) {
        syncControls();
        $('task-dialog').showModal();
        (focusTarget || $('dialog-cancel')).focus();
      }

      function closeDialog() {
        $('task-dialog').close();
      }

      function modalField(labelText, id, type, value, required) {
        const field = element('div', 'field');
        const label = element('label', '', labelText);
        label.htmlFor = id;
        const input = element(type === 'textarea' ? 'textarea' : 'input');
        input.id = id;
        if (type !== 'textarea') input.type = type;
        input.value = value || '';
        input.required = Boolean(required);
        input.addEventListener('input', () => input.setCustomValidity(''));
        field.append(label, input);
        $('dialog-fields').append(field);
        return input;
      }

      function openReschedule(task) {
        openDialog(task, '期限を再設定', '期限を更新');
        const input = modalField('新しい期限', 'reschedule-due', 'date', task.overdue ? shiftDate(state.today, 1) : task.due, true);
        const choices = element('div', 'quick-dates');
        choices.setAttribute('aria-label', '新しい期限の候補');
        quickDates(choices, input, false);
        $('dialog-fields').append(choices);
        modalSubmit = () => {
          if (!validDue(input)) return;
          if (input.value === task.due) {
            input.setCustomValidity('現在とは別の日付を選んでください。');
            input.reportValidity();
            return;
          }
          request('rescheduleTask', [task.id, input.value], '期限を更新しました', closeDialog);
        };
        showDialog(input);
      }

      function openCategory(task) {
        openDialog(task, '分類を変更', '分類を更新');
        const field = element('div', 'field');
        const label = element('label', '', '分類');
        label.htmlFor = 'edit-category';
        const select = element('select');
        select.id = 'edit-category';
        populateCategories(select, task.category);
        field.append(label, select, element('p', 'hint', '変更後は、内容を編集しても選んだ分類を維持します。'));
        $('dialog-fields').append(field);
        modalSubmit = () => request('setCategory', [task.id, select.value], '分類を更新しました', closeDialog);
        showDialog(select);
      }

      function openEdit(task) {
        openDialog(task, '依頼を編集', '変更を保存');
        const assignee = modalField('依頼先（必須）', 'edit-assignee', 'text', task.assignee, true);
        assignee.setAttribute('list', 'assignee-options');
        const title = modalField('依頼内容（必須）', 'edit-title', 'text', task.title, true);
        const detail = modalField('詳細（任意）', 'edit-detail', 'textarea', task.detail, false);
        if (task.category_source !== 'manual') {
          $('dialog-fields').append(element('p', 'hint', '分類は、変更後の内容と詳細から自動判別します。'));
        }
        modalSubmit = () => {
          if (!requiredText(assignee, '依頼先を入力してください。') || !requiredText(title, '依頼内容を入力してください。')) return;
          request('editTask', [task.id, { assignee: assignee.value.trim(), title: title.value.trim(), detail: detail.value.trim() }], '依頼を更新しました', closeDialog);
        };
        showDialog(assignee);
      }

      function openDelete(task) {
        openDialog(task, 'この依頼を削除しますか？', '削除する', true);
        $('dialog-fields').append(element('p', 'hint', '一覧から削除されます。この操作は元に戻せません。'));
        modalSubmit = () => request('deleteTask', [task.id], '依頼を削除しました', closeDialog);
        showDialog($('dialog-cancel'));
      }

      $('add-form').addEventListener('submit', event => {
        event.preventDefault();
        if (busy || !state) return;
        if (!requiredText($('assignee'), '依頼先を入力してください。') ||
            !requiredText($('task-title'), '依頼内容を入力してください。') || !validDue($('task-due'))) return;
        const input = {
          assignee: $('assignee').value.trim(),
          title: $('task-title').value.trim(),
          detail: $('task-detail').value.trim(),
          due: $('task-due').value,
          category: manualCategory ? $('task-category').value : ''
        };
        request('addTask', [input], '依頼を登録しました', resetAddForm);
      });
      ['assignee', 'task-title', 'task-detail', 'task-due'].forEach(id => {
        $(id).addEventListener('input', () => $(id).setCustomValidity(''));
      });
      $('task-title').addEventListener('input', updateCategoryPreview);
      $('task-detail').addEventListener('input', updateCategoryPreview);
      $('task-due').addEventListener('input', () => { dueTouched = true; });
      $('task-due').addEventListener('change', () => { dueTouched = true; });
      quickDates($('add-quick-dates'), $('task-due'), true, () => { dueTouched = true; });
      $('category-preview').addEventListener('click', () => {
        if (busy || !state) return;
        manualCategory = true;
        $('task-category').value = predictedCategory();
        updateCategoryPreview();
        $('task-category').focus();
      });
      $('use-auto-category').addEventListener('click', () => {
        if (busy) return;
        manualCategory = false;
        updateCategoryPreview();
        $('category-preview').focus();
      });
      $('refresh').addEventListener('click', () => request('getState', [], '最新の状態に更新しました'));
      $('dismiss-toast').addEventListener('click', clearError);
      $('dialog-cancel').addEventListener('click', () => { if (!busy) closeDialog(); });
      $('dialog-form').addEventListener('submit', event => {
        event.preventDefault();
        if (!busy && modalSubmit) modalSubmit();
      });
      $('task-dialog').addEventListener('cancel', event => { if (busy) event.preventDefault(); });
      $('task-dialog').addEventListener('close', () => {
        modalSubmit = null;
        modalTaskId = null;
        if (modalOpener && modalOpener.isConnected) modalOpener.focus();
        else $('refresh').focus();
        modalOpener = null;
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return;
        if (busy) refreshPending = true;
        else {
          refreshPending = false;
          request('getState', [], '最新の状態に更新しました');
        }
      });
      request('getState', [], '最新の状態です');
    })();
  </script>
</body>
</html>
